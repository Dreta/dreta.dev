<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hardware accelerator landscape</title>
  <desc id="desc">Sequence alignment moves from general-purpose processors through FPGA and ASIC accelerators toward processing in memory.</desc>
  <rect width="1200" height="800" fill="#9e0059"/>
  <text x="72" y="92" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">The hardware landscape</text>
  <text x="72" y="146" fill="#fae1df" font-family="Arial, sans-serif" font-size="25">Architectures evolve as computation moves closer to data</text>
  <path d="M145 416H1055" fill="none" stroke="#fae1df" stroke-width="10" stroke-linecap="round"/>
  <path d="M1017 381L1064 416L1017 451" fill="none" stroke="#fae1df" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="170" cy="416" r="90" fill="#390099"/>
      <text x="170" y="406" fill="#fff" font-size="34" font-weight="700">CPU</text>
      <text x="170" y="448" fill="#fae1df" font-size="20">Software</text>
    </g>
    <g>
      <circle cx="450" cy="416" r="104" fill="#7300ff"/>
      <text x="450" y="406" fill="#fff" font-size="34" font-weight="700">FPGA</text>
      <text x="450" y="448" fill="#fae1df" font-size="20">Reconfigurable</text>
    </g>
    <g>
      <circle cx="735" cy="416" r="118" fill="#ff0054"/>
      <text x="735" y="406" fill="#fff" font-size="34" font-weight="700">ASIC</text>
      <text x="735" y="448" fill="#fae1df" font-size="20">Specialized</text>
    </g>
    <g>
      <circle cx="1015" cy="416" r="132" fill="#ff5400"/>
      <text x="1015" y="406" fill="#16001f" font-size="34" font-weight="700">PIM</text>
      <text x="1015" y="448" fill="#16001f" font-size="20">Near memory</text>
    </g>
  </g>
</svg>
